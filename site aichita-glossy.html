<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1420;--rose:#b83a63;--bl:#fbeff1;--gold:#a9823a;--ln:#ebd9dd}
*{box-sizing:border-box;margin:0}
body{font:16px/1.55 Jost,system-ui,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',serif;line-height:1.1}
h1{font-size:clamp(2.4rem,7vw,4.6rem)}h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:16px}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.w{max-width:1150px;margin:0 auto;padding:0 16px}section{padding:44px 0}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-size:1.6rem;font-weight:700;display:flex;gap:8px;align-items:center;color:var(--rose)}.logo img{height:34px}
header input{flex:1;min-width:160px;order:3;flex-basis:100%}
@media(min-width:760px){header input{order:0;flex-basis:auto}}
nav{display:flex;gap:16px;margin-left:auto;font-weight:500}nav b{background:var(--rose);color:#fff;border-radius:99px;padding:0 7px;font-size:.8rem}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;width:100%;background:#fff}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.btn,button{font:inherit;font-weight:600;background:var(--rose);color:#fff;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;display:inline-block;transition:opacity .2s}
.btn:hover,button:hover{opacity:.88}button:disabled{opacity:.4;cursor:not-allowed}
.o{background:#fff;color:var(--ink);border:1px solid var(--ink)}.g{background:#25d366}.wv{background:#1dc8f2;color:#00303c}.sm{padding:6px 10px;font-size:.85rem}.dg{background:#8a1c1c}
.hero{background:var(--bl);padding:0}.hero .w{display:grid;gap:28px;padding:44px 16px;align-items:center}
@media(min-width:800px){.hero .w{grid-template-columns:1.2fr 1fr}}
.hero p{margin:14px 0 22px;max-width:46ch;font-size:1.1rem}.hp{background:var(--rose);border-radius:200px 200px 12px 12px;overflow:hidden;aspect-ratio:4/5;position:relative;max-width:380px;width:100%;justify-self:center}
.hp img{width:100%;height:100%;object-fit:cover}.hp span{position:absolute;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:10px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{background:#fff;color:var(--ink);border:1px solid var(--ln)}.chips .on{background:var(--ink);color:#fff}
.tb{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.tb select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card h3{font-size:1.25rem;margin-top:8px}.card s{color:#888;font-size:.9rem}.card strong{color:var(--rose)}
.im{aspect-ratio:1;background:var(--bl);border-radius:10px;overflow:hidden;position:relative}.im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover img{transform:scale(1.04)}
.tag{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:99px}.pr{background:var(--rose)}
.promo{background:var(--ink);color:#fff;text-align:center}.promo h2{color:#fff}
.two{display:grid;gap:28px;align-items:center}@media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
.own img{border-radius:50%;width:220px;height:220px;object-fit:cover;margin:auto}.own q{font-family:'Cormorant Garamond',serif;font-size:1.5rem;display:block;margin-top:12px;color:var(--rose)}
footer{background:var(--bl);padding:36px 16px;font-size:.95rem}footer .w{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.wa{position:fixed;right:16px;bottom:16px;z-index:30;background:#25d366;color:#fff;border-radius:99px;padding:13px 18px;font-weight:600;box-shadow:0 4px 14px #0003}
.pd{display:grid;gap:26px}@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.main{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bl)}.main img{width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th img{width:70px;height:70px;object-fit:cover;border-radius:6px;cursor:pointer}
.pr2{font-size:1.8rem;color:var(--rose);font-weight:600;margin:8px 0}.ac{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.ac>*{flex:1 1 200px;text-align:center}
.q{display:flex;align-items:center;gap:6px}.q input{width:64px;text-align:center}.q button{padding:8px 13px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.row img{width:64px;height:64px;object-fit:cover;border-radius:8px}.row .gr{flex:1;min-width:140px}
form{display:grid;gap:12px}label{font-size:.9rem;font-weight:500;display:grid;gap:4px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:50;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;animation:in .25s}.er{background:#8a1c1c}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty,.msg{text-align:center;padding:40px 16px;color:#6a5560}.msg.b{background:#fff3cd;color:#5c4400;border-radius:8px;text-align:left}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--ln)}.tabs .on{background:var(--ink);color:#fff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.st div{background:var(--bl);padding:16px;border-radius:10px}.st b{font-size:1.6rem;display:block;color:var(--rose)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}.bars i{flex:1;background:var(--rose);border-radius:3px 3px 0 0;min-height:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.strip{display:flex;gap:8px;flex-wrap:wrap}.strip div{position:relative}.strip img{width:76px;height:76px;object-fit:cover;border-radius:6px}.strip button{position:absolute;top:0;right:0;padding:0 6px;background:#8a1c1c}
.sk{height:200px;background:linear-gradient(90deg,var(--bl),#fff,var(--bl));background-size:200%;animation:sh 1.2s infinite;border-radius:10px}@keyframes sh{to{background-position:-200%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header id="hd"></header><main id="app"><div class="w"><div class="sk"></div></div></main><footer id="ft"></footer><div id="wf"></div><div class="toasts" id="ts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURATION : collez ici les 2 valeurs de Supabase (Project Settings > API) ===== */
const CFG={url:'https://avvwbskfwmocsututihf.supabase.co',key:'sb_publishable_ZG-2h2FcB22Was7Gipa0Aw_d7--UNee'};
/* Numéro WhatsApp, lien Wave, logo, photo, textes : Administration > Réglages (pas dans le code) */
const ok=CFG.url.startsWith('https://'),sb=ok?supabase.createClient(CFG.url,CFG.key):null;
const $=s=>document.querySelector(s),F=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D={name:'Aïchita Glossy',heroTitle:'Révélez votre éclat',heroText:'Beauté, mode et accessoires choisis avec soin, livrés chez vous.',promoTitle:'',promoText:'',about:'',ownerName:'',ownerText:'',ownerQuote:'',ownerPhoto:'',logo:'',phone:'',whatsapp:'',wave:'',address:'',hours:'',delivery:'',instagram:'',facebook:'',tiktok:''};
let P=[],S={...D},O=[],f={q:'',cat:'',sort:'new'},cart={},A={tab:'stats',ed:null},pay='',loadErr='';
try{cart=JSON.parse(localStorage.getItem('ag_cart')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ag_cart',JSON.stringify(cart))}catch(e){}cc()};
const cc=()=>{const n=Object.values(cart).reduce((a,b)=>a+b,0),e=$('#cc');if(e)e.textContent=n||''};
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' er':'');t.textContent=m;$('#ts').append(t);setTimeout(()=>t.remove(),3400)}
const img=(u,a)=>u?`<img loading="lazy" src="${E(u)}" alt="${E(a)}">`:'';
const wnum=()=>(S.whatsapp||'').replace(/\D/g,'');
function wa(t){if(!wnum()){toast('Numéro WhatsApp non configuré par la boutique.',1);return}window.open(`https://wa.me/${wnum()}?text=${encodeURIComponent(t)}`,'_blank')}
const ci=()=>Object.entries(cart).map(([id,q])=>({p:P.find(x=>x.id===id),q})).filter(x=>x.p&&x.p.stock>0).map(x=>({p:x.p,q:Math.min(x.q,x.p.stock)}));
const tot=()=>ci().reduce((s,x)=>s+x.p.price*x.q,0);
const lines=()=>ci().map(x=>`🛍️ ${x.p.name} × ${x.q} — ${F(x.p.price*x.q)}`).join('\n');

async function load(){
  if(!sb)return;
  const [a,b]=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),sb.from('settings').select('data').eq('id',1).maybeSingle()]);
  if(a.error)loadErr=a.error.message;
  P=(a.data||[]).map(p=>({...p,images:p.images||[]}));S={...D,...(b.data?.data||{})};
}
function shell(){
  $('#hd').innerHTML=`<a class="logo" href="#/">${S.logo?img(S.logo,S.name):''}<span>${E(S.name)}</span></a><input type="search" placeholder="Rechercher un produit" aria-label="Rechercher" value="${E(f.q)}" oninput="srch(this.value)"><nav><a href="#/">Boutique</a><a href="#/panier">Panier <b id="cc"></b></a></nav>`;
  const soc=[['instagram','Instagram'],['facebook','Facebook'],['tiktok','TikTok']].filter(x=>S[x[0]]).map(x=>`<a href="${E(S[x[0]])}" target="_blank" rel="noopener">${x[1]}</a>`).join(' &nbsp; ');
  $('#ft').innerHTML=`<div class="w"><div><h3>${E(S.name)}</h3><p>${E(S.address)}</p><p>${E(S.hours)}</p></div><div><h3>Contact</h3>${S.phone?`<p><a href="tel:${E(S.phone)}">${E(S.phone)}</a></p>`:''}<p>${soc}</p></div><div><h3>Livraison</h3><p>${E(S.delivery)}</p><p><a href="#/admin"><small>Administration</small></a></p></div></div>`;
  $('#wf').innerHTML=wnum()?`<a class="wa" href="https://wa.me/${wnum()}" target="_blank" rel="noopener">WhatsApp</a>`:'';
  cc();
}
function srch(v){f.q=v;if(location.hash.length>2&&!/^#\/?$/.test(location.hash))location.hash='#/';else grid()}
const card=p=>`<a class="card" href="#/produit/${p.id}"><div class="im">${img(p.images[0],p.name)}${p.stock<1?'<b class="tag">Rupture de stock</b>':p.old_price>p.price?`<b class="tag pr">-${Math.round(100-p.price/p.old_price*100)}%</b>`:''}</div><h3>${E(p.name)}</h3><strong>${F(p.price)}</strong> ${p.old_price>p.price?`<s>${F(p.old_price)}</s>`:''}</a>`;
function grid(){
  const g=$('#grid');if(!g)return;const q=f.q.toLowerCase();
  const a=P.filter(p=>(!f.cat||p.category===f.cat)&&(!q||(p.name+' '+p.description+' '+p.category).toLowerCase().includes(q)));
  a.sort({new:(x,y)=>new Date(y.created_at)-new Date(x.created_at),asc:(x,y)=>x.price-y.price,desc:(x,y)=>y.price-x.price}[f.sort]);
  g.innerHTML=a.length?a.map(card).join(''):'<p class="empty">Aucun produit ne correspond à votre recherche.</p>';
}
const nf=(m,b)=>`<div class="w msg"><h2>${m}</h2><a class="btn" href="#/">${b||'Retour à la boutique'}</a></div>`;
function home(){
  document.title=S.name+' — Beauté, mode et style';
  const cats=[...new Set(P.map(p=>p.category).filter(Boolean))],fe=P.filter(p=>p.featured&&p.stock>0).slice(0,4),hp=fe[0]||P[0];
  return `${!ok?`<div class="w"><p class="msg b"><b>Configuration requise :</b> ouvrez index.html, repérez « CONFIGURATION » et renseignez l'URL et la clé Supabase. Puis exécutez supabase.sql.</p></div>`:''}${loadErr?`<div class="w"><p class="msg b">Erreur de chargement : ${E(loadErr)}</p></div>`:''}
  <section class="hero"><div class="w"><div><h1>${E(S.heroTitle)}</h1><p>${E(S.heroText)}</p><button onclick="$('#cat').scrollIntoView({behavior:'smooth'})">Découvrir la boutique</button></div>${hp?`<a class="hp" href="#/produit/${hp.id}">${img(hp.images[0],hp.name)}<span>${E(hp.name)}</span></a>`:'<div></div>'}</div></section>
  ${fe.length?`<section class="w"><h2>Nos coups de cœur</h2><div class="grid">${fe.map(card).join('')}</div></section>`:''}
  <section class="w" id="cat"><h2>La boutique</h2><div class="chips"><button class="${f.cat?'':'on'}" onclick="setCat('')">Tout</button>${cats.map(c=>`<button class="${f.cat===c?'on':''}" onclick="setCat(this.textContent)">${E(c)}</button>`).join('')}</div>
  <div class="tb"><span>Trier par</span><select aria-label="Trier" onchange="f.sort=this.value;grid()"><option value="new">Nouveautés</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></div><br><div class="grid" id="grid"></div></section>
  ${S.promoTitle?`<section class="promo"><div class="w"><h2>${E(S.promoTitle)}</h2><p>${E(S.promoText)}</p></div></section>`:''}
  ${S.about?`<section class="w two"><div><h2>La boutique</h2><p>${E(S.about)}</p></div><div class="chips"><a class="btn g" onclick="wa('Bonjour ${E(S.name)} 👋')" href="#/">Écrire sur WhatsApp</a>${S.phone?`<a class="btn o" href="tel:${E(S.phone)}">Appeler</a>`:''}</div></section>`:''}
  ${S.ownerName?`<section class="w two own">${S.ownerPhoto?img(S.ownerPhoto,S.ownerName):''}<div><h2>${E(S.ownerName)}</h2><p>${E(S.ownerText)}</p>${S.ownerQuote?`<q>${E(S.ownerQuote)}</q>`:''}</div></section>`:''}`;
}
function setCat(c){f.cat=c;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',(b.textContent==='Tout'&&!c)||b.textContent===c));grid()}
function prod(id){
  const p=P.find(x=>x.id===id);if(!p)return nf('Produit introuvable');
  document.title=p.name+' — '+S.name;const out=p.stock<1;
  return `<div class="w"><section class="pd"><div><div class="main" id="mi">${img(p.images[0],p.name)}</div><div class="th">${p.images.map(u=>`<img src="${E(u)}" alt="${E(p.name)}" onclick="$('#mi img').src=this.src">`).join('')}</div></div>
  <div><small>${E(p.category)} &nbsp; Réf. ${E(p.ref)}</small><h1 style="font-size:2.6rem">${E(p.name)}</h1><div class="pr2">${F(p.price)} ${p.old_price>p.price?`<s style="font-size:1rem;color:#888">${F(p.old_price)}</s>`:''}</div>
  <p>${E(p.description)}</p><p><b>${out?'Rupture de stock':p.stock<=5?`Plus que ${p.stock} en stock`:'Disponible'}</b></p>
  ${out?'':`<div class="q" style="margin-top:12px"><button class="o" onclick="qd(-1)" aria-label="Diminuer">−</button><input id="qty" type="number" min="1" max="${p.stock}" value="1" aria-label="Quantité"><button class="o" onclick="qd(1)" aria-label="Augmenter">+</button></div>`}
  <div class="ac">${out?`<button class="g" onclick="wa('Bonjour ${E(S.name)} 👋\\nLe produit « ${E(p.name)} » est-il bientôt disponible ?')">Demander la disponibilité</button>`:`<button onclick="add('${p.id}',qv(${p.stock}))">Ajouter au panier</button><button class="g" onclick="waP('${p.id}')">Commander sur WhatsApp</button>${S.wave?`<button class="wv" onclick="add('${p.id}',qv(${p.stock}),1);pay='wave';location.hash='#/commande'">Payer avec Wave</button>`:''}`}<button class="o" onclick="share('${p.id}')">Partager</button></div></div></section></div>`;
}
const qv=m=>Math.max(1,Math.min(m,+$('#qty').value||1));
function qd(d){const i=$('#qty');i.value=Math.max(1,Math.min(+i.max,(+i.value||1)+d))}
function add(id,q,quiet){const p=P.find(x=>x.id===id);if(!p||p.stock<1)return toast('Produit indisponible.',1);cart[id]=Math.min(p.stock,(cart[id]||0)+q);save();if(!quiet)toast('Ajouté au panier ✓')}
function waP(id){const p=P.find(x=>x.id===id),q=qv(p.stock);wa(`Bonjour ${S.name} 👋\nJe suis intéressé(e) par le produit suivant :\n🛍️ Produit : ${p.name}\n💰 Prix : ${F(p.price)}\n🔢 Quantité : ${q}\nJe souhaiterais passer commande. Merci.`)}
async function share(id){const p=P.find(x=>x.id===id),u=location.origin+location.pathname+'#/produit/'+id,t=`${p.name} — ${F(p.price)}`;
  if(navigator.share){try{await navigator.share({title:p.name,text:t,url:u})}catch(e){}}else window.open('https://wa.me/?text='+encodeURIComponent(t+'\n'+u),'_blank')}
function cartV(){
  document.title='Panier — '+S.name;const it=ci();if(!it.length)return nf('Votre panier est vide','Continuer mes achats');
  return `<div class="w"><section><h2>Mon panier</h2>${it.map(x=>`<div class="row">${img(x.p.images[0],x.p.name)}<div class="gr"><b>${E(x.p.name)}</b><br>${F(x.p.price)}</div><div class="q"><button class="o" onclick="cq('${x.p.id}',-1)" aria-label="Diminuer">−</button><b>${x.q}</b><button class="o" onclick="cq('${x.p.id}',1)" aria-label="Augmenter">+</button></div><b>${F(x.p.price*x.q)}</b><button class="dg sm" onclick="cq('${x.p.id}',-999)">Supprimer</button></div>`).join('')}
  <h3 style="margin:16px 0">Total : ${F(tot())}</h3><div class="ac"><a class="btn o" href="#/">Continuer mes achats</a><button class="o" onclick="cart={};save();render()">Vider le panier</button><a class="btn" href="#/commande">Passer commande</a></div></section></div>`;
}
function cq(id,d){const p=P.find(x=>x.id===id);cart[id]=(cart[id]||0)+d;if(cart[id]<1)delete cart[id];else if(cart[id]>p.stock){cart[id]=p.stock;toast('Stock maximum atteint.',1)}save();render()}
function checkout(){
  document.title='Commande — '+S.name;if(!ci().length)return nf('Votre panier est vide','Continuer mes achats');
  const i=(n,l,r,t)=>`<label>${l}<input name="${n}" ${t?`type="${t}"`:''} ${r?'required':''}></label>`;
  return `<div class="w"><section class="two" style="align-items:start"><div><h2>Finaliser ma commande</h2><form onsubmit="order(event)">${i('name','Nom complet',1)}${i('phone','Téléphone',1,'tel')}${i('whatsapp','Numéro WhatsApp',0,'tel')}${i('address','Adresse de livraison',1)}${i('city','Ville / zone',1)}<label>Remarque<textarea name="note" rows="2"></textarea></label>
  <label>Méthode de contact<select name="contact"><option>WhatsApp</option><option>Appel</option><option>SMS</option></select></label>
  <label>Paiement<select name="payment">${S.wave?`<option value="wave" ${pay==='wave'?'selected':''}>Wave</option>`:''}<option value="livraison">À la livraison</option><option value="whatsapp">Convenir sur WhatsApp</option></select></label><button id="ob">Confirmer la commande</button></form></div>
  <div><h3>Récapitulatif</h3><p style="white-space:pre-line;margin:10px 0">${E(lines())}</p><h3>Total : ${F(tot())}</h3><p><small>${E(S.delivery)}</small></p></div></section></div>`;
}
async function order(e){
  e.preventDefault();const b=$('#ob'),fd=Object.fromEntries(new FormData(e.target));b.disabled=true;b.textContent='Envoi en cours…';
  if(!sb){toast('Boutique non configurée.',1);b.disabled=false;return}
  const l=lines(),msg=`Bonjour ${S.name} 👋\nJe souhaite passer cette commande :\n${l}\n💰 Total : ${F(tot())}\n👤 Nom : ${fd.name}\n📞 Téléphone : ${fd.phone}\n📍 Livraison : ${fd.address}, ${fd.city}\nMerci de confirmer ma commande.`;
  const {data,error}=await sb.rpc('place_order',{cust:fd,cart:ci().map(x=>({id:x.p.id,qty:x.q})),pay:fd.payment});
  if(error){toast(error.message,1);b.disabled=false;b.textContent='Confirmer la commande';return}
  cart={};save();pay='';load();toast('Commande créée ✓');
  $('#app').innerHTML=`<div class="w msg"><h2>Merci, votre commande est enregistrée</h2><p>Numéro : <b>${E(data.number)}</b><br>Montant à régler : <b>${F(data.total)}</b></p><div class="ac" style="max-width:520px;margin:20px auto"><button class="g" id="wb">Envoyer ma commande sur WhatsApp</button>${fd.payment==='wave'&&S.wave?`<button class="wv" id="wv">Payer avec Wave</button>`:''}<a class="btn o" href="#/">Retour à la boutique</a></div>${fd.payment==='wave'?'<p><small>Une fois le paiement effectué, revenez ici ou envoyez la capture sur WhatsApp pour confirmer.</small></p>':''}</div>`;
  $('#wb').onclick=()=>wa(msg+`\nN° ${data.number}`);const w=$('#wv');if(w)w.onclick=()=>{toast('Redirection vers Wave…');window.open(S.wave,'_blank','noopener')};
  scrollTo(0,0);
}
/* ===== ADMINISTRATION ===== */
async function adm(){
  document.title='Administration — '+S.name;if(!sb)return nf('Supabase non configuré');
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return `<div class="w"><section style="max-width:380px;margin:auto"><h2>Connexion</h2><form onsubmit="login(event)"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Mot de passe<input name="pw" type="password" required autocomplete="current-password"></label><button>Se connecter</button></form></section></div>`;
  const {data:a,error:ae}=await sb.from('admins').select('user_id').maybeSingle();
if(!a){return nf('Accès refusé : '+(ae?ae.message:'compte absent de la table admins'))}
  const r=await sb.from('orders').select('*').order('created_at',{ascending:false});O=r.data||[];
  const T=['stats','produits','commandes','clients','réglages'];
  return `<div class="w"><section><div class="tb"><h2>Administration</h2><button class="o sm" onclick="sb.auth.signOut().then(render)">Déconnexion</button></div><div class="tabs">${T.map(t=>`<button class="${A.tab===t?'on':''}" onclick="A.tab='${t}';A.ed=null;render()">${t}</button>`).join('')}</div><div id="ad">${A.tab==='stats'?stats():A.tab==='produits'?prods():A.tab==='commandes'?ords():A.tab==='clients'?cli():sets()}</div></section></div>`;
}
async function login(e){e.preventDefault();const d=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:d.get('email'),password:d.get('pw')});if(error)return toast('Email ou mot de passe incorrect.',1);render()}
function stats(){
  const live=O.filter(o=>o.status!=='Annulée'),c={};live.forEach(o=>o.items.forEach(i=>c[i.name]=(c[i.name]||0)+i.qty));
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),days=[...Array(14)].map((_,k)=>{const d=new Date(Date.now()-(13-k)*864e5).toDateString();return O.filter(o=>new Date(o.created_at).toDateString()===d).length}),m=Math.max(1,...days);
  return `<div class="st"><div><b>${P.length}</b>Produits</div><div><b>${O.length}</b>Commandes</div><div><b>${O.filter(o=>o.status==='En attente').length}</b>En attente</div><div><b>${O.filter(o=>o.status==='Livrée').length}</b>Livrées</div><div><b>${F(live.reduce((s,o)=>s+o.total,0))}</b>Chiffre d'affaires (hors annulées)</div></div>
  <h3 style="margin-top:22px">Produits les plus commandés</h3>${top.length?`<ol style="padding-left:20px">${top.map(t=>`<li>${E(t[0])} : ${t[1]}</li>`).join('')}</ol>`:'<p class="empty">Pas encore de commandes.</p>'}<h3>Commandes sur 14 jours</h3><div class="bars">${days.map(n=>`<i title="${n}" style="height:${n/m*100}%"></i>`).join('')}</div>`;
}
function prods(){
  if(A.ed){const p=A.ed;return `<form onsubmit="pSave(event)"><h3>${p.id?'Modifier':'Nouveau produit'}</h3>
  <label>Nom<input name="name" required value="${E(p.name)}"></label><label>Référence<input name="ref" value="${E(p.ref)}"></label><label>Catégorie<input name="category" value="${E(p.category)}"></label>
  <label>Prix (FCFA)<input name="price" type="number" min="0" required value="${p.price??''}"></label><label>Ancien prix (promotion)<input name="old_price" type="number" min="0" value="${p.old_price??''}"></label><label>Stock<input name="stock" type="number" min="0" required value="${p.stock??0}"></label>
  <label>Description<textarea name="description" rows="4">${E(p.description)}</textarea></label><label><span><input type="checkbox" name="featured" style="width:auto" ${p.featured?'checked':''}> Produit en vedette</span></label>
  <label>Photos<input type="file" accept="image/*" multiple onchange="addImg(this)"></label><div class="strip" id="strip">${strip()}</div><div class="ac"><button>Enregistrer</button><button type="button" class="o" onclick="A.ed=null;render()">Annuler</button></div></form>`}
  return `<button onclick="A.ed={images:[],stock:0,ref:'AG-'+Date.now().toString(36).toUpperCase()};render()">+ Nouveau produit</button><div class="tw"><table><tr><th>Produit</th><th>Prix</th><th>Stock</th><th></th></tr>${P.map(p=>`<tr><td>${E(p.name)}${p.featured?' ★':''}<br><small>${E(p.category)}</small></td><td>${F(p.price)}</td><td>${p.stock}</td><td><button class="sm o" onclick="pEdit('${p.id}')">Modifier</button> <button class="sm o" onclick="pDup('${p.id}')">Dupliquer</button> <button class="sm dg" onclick="pDel('${p.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`;
}
const strip=()=>A.ed.images.map((u,i)=>`<div>${img(u,'')}<button type="button" onclick="A.ed.images.splice(${i},1);$('#strip').innerHTML=strip()" aria-label="Retirer">×</button></div>`).join('');
async function up(file){
  const b=await createImageBitmap(file),r=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  const blob=await new Promise(z=>c.toBlob(z,'image/webp',.82)),n=crypto.randomUUID()+'.webp',{error}=await sb.storage.from('products').upload(n,blob,{contentType:'image/webp'});
  if(error)throw error;return sb.storage.from('products').getPublicUrl(n).data.publicUrl;
}
async function addImg(i){toast('Envoi des photos…');try{for(const x of i.files)A.ed.images.push(await up(x));$('#strip').innerHTML=strip();toast('Photos ajoutées ✓')}catch(e){toast(e.message,1)}}
const pEdit=id=>{A.ed={...P.find(p=>p.id===id)};render()};
async function pSave(e){
  e.preventDefault();const d=new FormData(e.target),p=A.ed,row={name:d.get('name').trim(),ref:d.get('ref'),category:d.get('category').trim(),price:+d.get('price'),old_price:d.get('old_price')?+d.get('old_price'):null,stock:+d.get('stock'),description:d.get('description'),featured:d.has('featured'),images:p.images};
  const {error}=p.id?await sb.from('products').update(row).eq('id',p.id):await sb.from('products').insert(row);
  if(error)return toast(error.message,1);toast('Modification enregistrée ✓');A.ed=null;await load();render();
}
async function pDup(id){const {id:_,created_at:__,...p}=P.find(x=>x.id===id),{error}=await sb.from('products').insert({...p,name:p.name+' (copie)',ref:p.ref+'-2'});if(error)return toast(error.message,1);toast('Produit dupliqué ✓');await load();render()}
async function pDel(id){if(!confirm('Supprimer définitivement ce produit ?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return toast(error.message,1);toast('Produit supprimé');await load();render()}
const ST=['En attente','Confirmée','En préparation','Expédiée','Livrée','Annulée'];
function ords(){
  return O.length?`<div class="tw"><table><tr><th>N°</th><th>Client</th><th>Produits</th><th>Total</th><th>Statut</th></tr>${O.map(o=>`<tr><td>${E(o.number)}<br><small>${new Date(o.created_at).toLocaleString('fr-FR')}</small></td><td>${E(o.customer.name)}<br>${E(o.customer.phone)}<br><small>${E(o.customer.address)}, ${E(o.customer.city)}</small></td><td>${o.items.map(i=>E(i.name)+' × '+i.qty).join('<br>')}</td><td>${F(o.total)}<br><small>${E(o.payment)}</small></td><td><select onchange="setSt('${o.id}',this.value)">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<p class="empty">Aucune commande pour le moment.</p>';
}
async function setSt(id,s){const {error}=await sb.from('orders').update({status:s}).eq('id',id);if(error)return toast(error.message,1);toast('Statut mis à jour ✓');await load()}
function cli(){
  const m={};O.forEach(o=>{const k=o.customer.phone,c=m[k]||(m[k]={n:o.customer.name,k,a:o.customer.address,o:[],t:0});c.o.push(o.number);if(o.status!=='Annulée')c.t+=o.total});
  const a=Object.values(m);return a.length?`<div class="tw"><table><tr><th>Client</th><th>Téléphone</th><th>Commandes</th><th>Total dépensé</th></tr>${a.map(c=>`<tr><td>${E(c.n)}<br><small>${E(c.a)}</small></td><td>${E(c.k)}</td><td>${c.o.length}<br><small>${c.o.map(E).join(', ')}</small></td><td>${F(c.t)}</td></tr>`).join('')}</table></div>`:'<p class="empty">Aucun client pour le moment.</p>';
}
const FL=[['name','Nom de la boutique'],['logo','Logo','img'],['phone','Téléphone'],['whatsapp','Numéro WhatsApp (format international, ex. 221770000000)'],['wave','Lien de paiement Wave (https://…)'],['address','Adresse'],['hours','Horaires'],['delivery','Informations de livraison','t'],['instagram','Instagram (lien)'],['facebook','Facebook (lien)'],['tiktok','TikTok (lien)'],['heroTitle','Titre d\'accueil'],['heroText','Texte d\'accueil','t'],['promoTitle','Titre de la promotion'],['promoText','Texte de la promotion','t'],['about','Présentation de la boutique','t'],['ownerName','Propriétaire : nom'],['ownerPhoto','Propriétaire : photo','img'],['ownerText','Propriétaire : présentation','t'],['ownerQuote','Propriétaire : citation']];
function sets(){
  return `<form onsubmit="sSave(event)">${FL.map(([k,l,t])=>t==='img'?`<label>${l}<input type="file" accept="image/*" onchange="sImg('${k}',this)"><input name="${k}" value="${E(S[k])}" placeholder="URL de l'image"></label>`:t==='t'?`<label>${l}<textarea name="${k}" rows="3">${E(S[k])}</textarea></label>`:`<label>${l}<input name="${k}" value="${E(S[k])}"></label>`).join('')}<button>Enregistrer les réglages</button></form>`;
}
async function sImg(k,i){try{toast('Envoi…');const u=await up(i.files[0]);i.nextElementSibling.value=u;toast('Image prête : enregistrez les réglages')}catch(e){toast(e.message,1)}}
async function sSave(e){
  e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.whatsapp=d.whatsapp.replace(/\D/g,'');
  if(d.wave&&!/^https:\/\//.test(d.wave))return toast('Le lien Wave doit commencer par https://',1);
  const {error}=await sb.from('settings').update({data:d}).eq('id',1);if(error)return toast(error.message,1);S={...D,...d};shell();toast('Modification enregistrée ✓');
}
/* ===== ROUTEUR ===== */
async function render(){
  const h=location.hash.replace(/^#\/?/,''),[r,id]=h.split('/'),adminPath=/\/admin\/?$/.test(location.pathname);let v;
  if(r==='admin'||(adminPath&&!r))v=await adm();else if(r==='produit')v=prod(id);else if(r==='panier')v=cartV();else if(r==='commande')v=checkout();else if(!r)v=home();else v=nf('Page introuvable');
  $('#app').innerHTML=v;cc();if(!r&&!adminPath)grid();if(r!=='admin')scrollTo(0,0);
}
addEventListener('hashchange',render);
(async()=>{await load();shell();render()})();
</script></body></html>
